[project]
name = "daily-brief"
version = "0.1.0"
description = "Personal morning podcast built from other podcasts: an hourly one-episode builder, one MP3 a morning and a podcast feed"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "faster-whisper>=1.2",
    "numpy>=1.26",
    "pyyaml>=6",
    "soundfile>=0.14.0",
    "uvicorn>=0.30",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
