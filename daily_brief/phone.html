<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Brief</title>
<style>
  :root {
    --bg: #0b0d12; --card: #151924; --line: #232a3a; --text: #e8ebf2; --muted: #8b93a7;
    --accent: #f2b54a; --good: #4cc38a; --warn: #e5705c; --blue: #6aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; padding: 16px 16px 120px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .date { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .seg-title { font-size: 17px; font-weight: 650; margin: 0 0 6px; }
  .note { color: var(--muted); font-size: 14px; }
  .item { border-top: 1px solid var(--line); padding: 12px 0 4px; }
  .item:first-of-type { border-top: 0; }
  .role { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .why { margin: 4px 0 8px; }
  .src { color: var(--muted); font-size: 13px; }
  .fb { display: flex; gap: 8px; margin: 8px 0 6px; }
  .fb button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
               background: #1c2231; color: var(--text); font-size: 15px; }
  .fb button.on { border-color: var(--accent); background: #2a2415; }
  details { margin-top: 10px; } summary { color: var(--muted); cursor: pointer; min-height: 32px; }
  .cut { font-size: 14px; color: var(--muted); margin: 6px 0; }
  .cut b { color: var(--warn); font-weight: 600; }
  .sowhat { border-left: 3px solid var(--good); padding-left: 10px; margin-top: 10px; font-size: 15px; }
  .upnext .item { padding: 10px 0 2px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .banner { background: #2a2415; border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; margin: 8px 0 12px; }
  .banner b { color: var(--accent); }
  .banner pre { white-space: pre-wrap; font-size: 12px; max-height: 50vh; overflow: auto; background: #0f131b;
                padding: 8px; border-radius: 8px; }
  .banner pre .add { color: var(--good); } .banner pre .del { color: var(--warn); }
  .banner .row { display: flex; gap: 8px; margin-top: 8px; }
  .banner .row button { flex: 1; min-height: 44px; border-radius: 10px; border: 0; font-size: 15px; }
  .ok { background: var(--good); color: #0b0d12; font-weight: 700; } .no { background: #1c2231; color: var(--text); }
  .libday { margin-top: 10px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
  .librow { display: flex; justify-content: space-between; gap: 8px; min-height: 36px; margin: 4px 0; font-size: 15px; }
  .librow span:last-child { color: var(--muted); white-space: nowrap; }
  .libday a { color: var(--blue); }
  #player { width: 100%; margin: 4px 0 8px; }
  .toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #222a3b;
           padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<h1>Morning Brief</h1>
<div class="date" id="date">Loading…</div>
<audio id="player" controls preload="none" src="latest.mp3"></audio>
<div class="note" id="spend"></div>
<div id="brief"></div>
<details class="card" id="libbox"><summary><b>Library</b> · past days</summary><div id="lib"></div></details>
<div id="segments"></div>

<div class="toast" id="toast"></div>

<script>
const NAMES = { A: "AI Engineering", B: "Product" };
const LABELS = { up: "👍", skip_topic: "Skip topic", deeper: "Go deeper" };
let state = { date: null, given: new Set() };

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function load() {
  const r = await fetch("/today"); const d = await r.json();
  state.date = d.date;
  document.getElementById("date").textContent = new Date(d.date + "T12:00").toLocaleDateString(undefined,
    { weekday: "long", month: "long", day: "numeric" });
  state.given = new Set(d.feedback.map(f => `${f.segment}|${f.cluster_id}|${f.kind}`));
  const box = document.getElementById("segments");
  const segs = Object.keys(d.segments).sort();
  if (!segs.length) {
    // not assembled yet: show what is waiting in the library (the morning is assembled at the configured time, or on the first request for the MP3)
    const up = d.up_next || [];
    box.innerHTML = up.length ? `<div class="card upnext"><div class="seg-title">Up next</div>${up.map(e => `
      <div class="item">
        <div class="role">${esc(NAMES[e.segment] || e.segment)} · ${esc(Math.round(e.seconds / 60))} min</div>
        <div class="seg-title">${esc(e.title)}</div>
        <div class="why">${esc(e.why)}</div>
      </div>`).join("")}</div>` : '<div class="empty">No segments for today yet.</div>';
    return;
  }
  box.innerHTML = segs.map(s => {
    const g = d.segments[s];
    const items = g.kept.map(k => `
      <div class="item">
        <div class="role">${esc(k.role.replace("_", " "))} · ${esc(k.minutes)} min</div>
        <div class="why">${esc(k.why)}</div>
        ${k.sources.length ? `<div class="src">${esc(k.sources.join(" · "))}</div>` : ""}
        <div class="fb">${Object.entries(LABELS).map(([kind, lab]) => {
          const on = state.given.has(`${s}|${k.cluster_id}|${kind}`) ? "on" : "";
          return `<button class="${on}" onclick="fb(this,'${s}','${esc(k.cluster_id)}','${kind}')">${lab}</button>`;
        }).join("")}</div>
      </div>`).join("");
    const cuts = g.cut.map(c => `<div class="cut"><b>${esc(c.reason)}</b> ${esc(c.note)}</div>`).join("");
    return `<div class="card">
      <div class="role">${esc(NAMES[s] || s)}</div>
      <div class="seg-title">${esc(g.title)}</div>
      ${items}
      ${g.so_what ? `<div class="sowhat">${esc(g.so_what)}</div>` : ""}
      <details><summary>Cut (${g.cut.length})</summary>${cuts}</details>
    </div>`;
  }).join("");
}

async function loadSpend() {
  const h = await (await fetch("/health/show")).json();
  document.getElementById("spend").textContent = `voice spend today $${h.spend_today.toFixed(3)} of $${h.cap.toFixed(3)}`;
}

async function fb(btn, segment, cluster_id, kind) {
  const r = await fetch("/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ date: state.date, segment, cluster_id, kind }) });
  if (r.ok) { btn.classList.add("on"); toast("Noted: " + LABELS[kind]); } else toast("Couldn't save");
}

async function loadLibrary() {
  const d = await (await fetch("/library")).json();
  const box = document.getElementById("lib");
  if (!d.days.length) { box.innerHTML = '<div class="empty">No recordings yet.</div>'; return; }
  const today = state.date;
  box.innerHTML = d.days.map(day => {
    const label = day.date === today ? "Today" : new Date(day.date + "T12:00").toLocaleDateString(undefined,
      { weekday: "short", month: "short", day: "numeric" });
    return `<div class="libday"><a href="/shows/${esc(day.date)}.mp3">${esc(label)}</a></div>` + day.segments.map(sg =>
      `<div class="librow"><span>${esc(NAMES[sg.segment] || sg.segment)}` +
      `${sg.title ? " · " + esc(sg.title) : ""}</span><span>${sg.seconds ? fmt(sg.seconds) : ""}</span></div>`).join("");
  }).join("");
}
function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
async function loadBrief() {
  const d = await (await fetch("/brief")).json();
  const box = document.getElementById("brief");
  if (!d.draft) { box.innerHTML = ""; return; }
  const diff = d.draft.diff.split("\n").filter(l => !l.startsWith("---") && !l.startsWith("+++")).map(l =>
    l.startsWith("+") ? `<span class="add">${esc(l)}</span>` : l.startsWith("-") ? `<span class="del">${esc(l)}</span>` : esc(l)
  ).join("\n");
  box.innerHTML = `<div class="banner"><b>Brief update waiting</b> · v${d.current.version} → v${d.draft.version}
    <details><summary>What changes</summary><pre>${diff}</pre></details>
    <div class="row"><button class="ok" onclick="decide('approve')">Approve</button>
    <button class="no" onclick="decide('reject')">Reject</button></div></div>`;
}
async function decide(action) {
  const r = await fetch("/brief/" + action, { method: "POST" });
  toast(r.ok ? (action === "approve" ? "Brief approved: used from tonight" : "Draft discarded") : "Couldn't save");
  loadBrief();
}

load().then(loadLibrary); loadSpend().catch(() => {}); loadBrief();
</script>
</body>
</html>
