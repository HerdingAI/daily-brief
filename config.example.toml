# Daily Brief configuration. Every tunable lives here, never as a code constant.
# Copy to config.toml and edit; docker-compose.yml mounts it at /app/config.toml.

[paths]
# These are paths inside the container (docker-compose.yml mounts ./var at /app/var and ${ARCHIVE_DIR:-./archive} at /archive).
var_dir = "/app/var"                                       # runtime state: db, work files, caches
archive_dir = "/archive/daily_brief"                       # long-term copy of aired shows + DB snapshots

[show]
segments = ["A", "B"]                                      # order in the joined episode
max_segment_minutes = 45                                   # a morning's segment takes episodes until this is full
min_segment_seconds = 60                                   # a ready episode shorter than this is treated as unplayable
assemble_at = "05:00"                                      # HH:MM local: from then on the builder assembles today's show (else the first MP3 request does)

[feed]                                                     # /feed.xml: the podcast feed of the newest assembled shows
title = "Daily Brief"
description = "A morning show built from the podcasts and talks worth hearing, in two hosts' voices."
items = 14                                                 # newest shows listed
base_url = ""                                              # public URL of this API (enclosure links); empty = taken from the request

[brief]
path = "/app/brief/brief.md"   # the seed baked into the image; approved briefs live in <var_dir>/brief (persisted, writable)
# a brief marked tv_safe: true must not mention any of these; checked case-insensitively.
# Put the private tags you never want shown on a shared screen here. Empty = no check.
tv_forbidden_terms = []

[collect]
new_window_days = 7            # published within N days of the run = "new"; older = back catalog
min_episode_seconds = 900      # skip trailers, announcements and clips
http_timeout_seconds = 60
user_agent = "Mozilla/5.0 (daily-brief personal podcast digest)"
feed_alert_hours = 24          # /health/show feeds_failing: a feed with no good collect for this long
feed_alert_lookback_hours = 168  # how far back to read build runs to find when the failing streak began
feed_error_chars = 200         # per-feed error text kept in the run meta

[transcribe]
# OpenRouter speech-to-text (key: voice.secrets_file); ~$0.0002/min, ~$0.012/hour of audio (measured 2026-10-25)
model = "qwen/qwen3-asr-0.6b"
chunk_seconds = 600            # audio is cut into mono 16 kHz mp3 chunks of this length, one request each
timeout_seconds = 300          # per request
retries = 3                    # on timeouts, 429 and 5xx only; 401/402/403 stop the run at once, nothing charged to the item
retry_wait_seconds = 10
marker_every_seconds = 30      # [mm:ss] markers in the transcript
max_attempts = 3               # after this many failed transcriptions an item is marked failed for good

[youtube]
ytdlp = "yt-dlp"
listing_limit = 15                # fallback when the channel RSS feed is down: newest N from the /videos tab
listing_timeout_seconds = 120
transcript_timeout_seconds = 30  # per request to youtube-transcript-api (the library sets none: a stall would hang the run)
audio_fallback = false         # transcript only, never download the video. No transcript = retry on a later hourly run

[llm]
command = "claude"
args = ["-p", "--output-format", "text"]
model = ""                        # empty = Claude Code's default model; set e.g. "opus" to pin
timeout_seconds = 600             # a real episode call takes ~2 min; with no network `claude -p` HANGS until killed,
                                  # so this is also the most one outage can block the builder per attempt
max_attempts = 2                  # second attempt gets the validation error fed back
health_cache_seconds = 600        # /health/llm asks `claude auth status` at most this often (it is a subprocess)
# failed-exit output (or a timeout) meaning Claude is unreachable / overloaded / limited: nothing is charged to the item
unavailable_patterns = ["Connection error", "ECONNREFUSED", "ENOTFOUND", "EAI_AGAIN", "ETIMEDOUT", "fetch failed", "socket hang up", "Overloaded", "overloaded_error", "usage limit", "rate limit", "rate_limit_error", "529", "503 Service"]
# output containing any of these means Claude is logged out: stop the run (exit 75), never retry per item
auth_error_patterns = ["Failed to authenticate", "OAuth session expired", "Invalid API key", "Please run /login", "authentication_error"]
# the token itself (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`) lives in voice.secrets_file, the one secrets file

[voice]
# HeyGen Voice via OpenRouter, the only engine: one request per turn, raw 16-bit pcm back. A failure of any kind
# fails the episode (retried by a later hourly run). The billed cost is read back per generation (the listed price
# is not the billed one) and counted against daily_cap_usd.
heygen_model = "heygen/heygen-voice-1-turbo"
heygen_sample_rate = 44100     # the pcm the API returns (measured); the voice WAV keeps it, no resampling (mix.MIX_RATE is the same)
heygen_timeout_seconds = 120
heygen_retries = 2             # on timeouts, 429 and 5xx only; other 4xx (402, bad voice) fail the episode at once
heygen_retry_wait_seconds = 10
price_per_million_chars = 4.0  # billed (measured); an estimate for the cap check
daily_cap_usd = 0.15           # no Claude call and no request if today's billed spend + this episode's estimate exceeds it
cost_readback_attempts = 6     # /generation stats lag the request by a few seconds
cost_readback_wait_seconds = 5
secrets_file = "/app/secrets.env"   # OPENROUTER_API_KEY=... and CLAUDE_CODE_OAUTH_TOKEN=... (chmod 600)
host_a = "weston"              # ALEX: HeyGen voice id
host_b = "meredith"            # SAM: HeyGen voice id
gap_seconds = 0.35             # pause after a turn when the same speaker continues
speaker_change_gap_seconds = 0.45  # pause when the next turn is the other host
turn_rms_dbfs = -20.0          # every turn is gain-matched to this RMS before joining (the two voices sit at different levels)
turn_peak_dbfs = -1.0          # peak ceiling for that gain: a loud turn is turned down, never clipped

[mix]
loudness_lufs = -16.0          # podcast loudness standard
true_peak_db = -1.5
bitrate = "128k"
intro = ""                     # optional sting before each segment (path); empty = none
outro = ""

[build]
interval_minutes = 60         # daily_brief.every starts a build run at each multiple of this (wall clock)
run_timeout_minutes = 90       # a run still going after this is killed; the loop goes on
# each run: collect, pick ONE episode, one Claude call (prompts/episode.md), HeyGen, loudness.
per_run = 1                    # episodes finished per run
max_attempts = 2               # charged failures (bad script twice, voice error) before an item is set aside
max_new_per_source_per_day = 1 # per creator, so a prolific channel (AI Engineer: several talks/day) can't crowd out the rest
max_skips_per_run = 2          # off-brief skips (each costs a Claude call) tolerated in one run before it stops
min_minutes = 4                # a script shorter than this is not an episode: the model should skip instead
max_minutes = 20
max_share_of_source = 0.4      # an episode runs at most this share of the source's spoken length (words), clamped to min/max_minutes
max_over = 0.15                # a script may run at most 15% over max_minutes
words_per_minute = 150         # spoken rate used to size scripts
chars_per_word = 6             # sizes the voice-cost estimate (incl. the space) before the script exists
max_turn_words = 90
max_same_speaker_run = 3
history_days = 30              # covered topics + feedback the model sees
hype_words = ["game-changer", "game changer", "revolutionary", "mind-blowing", "insane", "unprecedented"]

[qa]
max_wer = 0.05                 # python -m daily_brief.audio_qa exits 1 when the spoken episode differs from its script by more than this

[pipeline]
enabled_segments = ["A", "B"]  # segments the builder fills
keep_work_days = 7             # local work files (transcripts stay; audio/wav work is pruned)
keep_show_days = 7             # local assembled mornings
keep_library_days = 30          # var/library/<id>: kept this long after the episode aired (or was skipped); never while it waits
archive_keep_days = 90         # archive retention (~17 MB per segment per day)

# Podcasts use their RSS feeds (direct MP3s, no bot protection). YouTube only where there is no
# podcast feed: YouTube returned 403 on audio and 429 on captions in testing.
[api]
host = "0.0.0.0"               # inside the container; compose publishes it on 127.0.0.1 only. No auth: keep it that way, or put it behind a VPN / reverse proxy with auth
port = 8765

